name: Graphify Swift architecture audit
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-direct-no-p2p
    paths:
      - ".github/workflows/graphify-audit.yml"
      - ".graphifyignore"
permissions:
  contents: read
jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Graphify
        run: python -m pip install --disable-pip-version-check graphifyy
      - name: Build Swift code knowledge graph
        run: |
          set -euo pipefail
          graphify app --code-only
          test -s app/graphify-out/graph.json
          # Code-only extraction writes a complete graph. The narrative cluster
          # report is optional; never reject the graph for missing LLM backend.
          if [ ! -s app/graphify-out/GRAPH_REPORT.md ]; then
            graphify cluster-only app || true
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("app/graphify-out/graph.json").read_text())
          print("Graphify exported graph with top-level keys:", list(data))
          PY
      - name: Upload audit graph
        uses: actions/upload-artifact@v4
        with:
          name: StremioX-Graphify-Code-Graph
          path: app/graphify-out/
          retention-days: 14
